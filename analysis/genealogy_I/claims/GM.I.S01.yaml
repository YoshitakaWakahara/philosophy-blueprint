- claim_id: GM.I.S01.C01
  type: genealogy
  statement_ja: 英国の心理学者たちは、道徳の起源の歴史を探求しようとした唯一の哲学者たちであるとニーチェは認める。
  my_paraphrase: 善の起源探求の先駆者として認めつつ、その動機の浅さを問い直す冒頭の構え。
  concepts:
  - NIETZ.MORALITY_ORIGIN
  - NIETZ.PSYCHOLOGY_ENGLISH
  - NIETZ.GENEALOGY
  sources:
  - ref: GM I §1
  depends_on: []
- claim_id: GM.I.S01.C02
  type: diagnosis
  statement_ja: 英国の心理学者たちは、内なる世界の「恥部」に、知的自尊心が最も避けるであろう場所（習慣、忘却、受動的なメカニズムなど）に、道徳の支配的な原理を求める。
  my_paraphrase: ''
  concepts:
  - NIETZ.HUMAN_NATURE
  - NIETZ.INSTINCT
  - NIETZ.MORALITY_ORIGIN
  - NIETZ.PSYCHOLOGY_ENGLISH
  - NIETZ.SELF_RESPECT
