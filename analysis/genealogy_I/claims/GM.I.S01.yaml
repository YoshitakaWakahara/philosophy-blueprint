- claim_id: GM.I.S01.C05
  type: distinction
  statement_ja: ニーチェは、これらの分析心理学者たちが、本質的には勇敢で、誇り高く、寛大で、自己を律し、たとえ単純で苦く、醜く、嫌悪感を催し、非キリスト教的で不道徳なものであっても、あらゆる真実のために望ましいものを犠牲にする覚悟を持つ者であるよう願う。
  my_paraphrase: ''
